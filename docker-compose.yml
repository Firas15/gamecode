name: gamecode

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gamecode-web:latest
    restart: unless-stopped
    ports:
      # По умолчанию сайт смотрит наружу сам. При включении HTTPS
      # в .env ставится WEB_BIND=127.0.0.1 и WEB_PORT=8080 — тогда
      # снаружи доступен только nginx.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-gamecode}
      DB_USER: ${DB_USER:-gamecode_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - gc_data:/var/www/html/data
      - gc_news:/var/www/html/img/news
      - gc_avatars:/var/www/html/img/avatars
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api/version.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamecode}
      POSTGRES_USER: ${POSTGRES_USER:-gamecode_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Europe/Moscow
    volumes:
      - gc_pg:/var/lib/postgresql
      # выполняется ТОЛЬКО при первой инициализации пустого тома
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamecode_user} -d ${POSTGRES_DB:-gamecode}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # порт наружу не публикуем — доступ только из сети compose

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - gc_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── HTTPS-контур. Поднимается только с профилем: ──
  #    docker compose --profile https up -d
  nginx:
    image: nginx:alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/proxy.inc:/etc/nginx/proxy.inc:ro
      - gc_certs:/etc/letsencrypt
      - gc_acme:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    profiles: ["https"]
    restart: unless-stopped
    volumes:
      - gc_certs:/etc/letsencrypt
      - gc_acme:/var/www/certbot
    # Проверка обновления дважды в сутки; Let's Encrypt перевыпускает
    # сертификат за 30 дней до истечения, остальные запуски — no-op.
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  gc_pg:
  gc_redis:
  gc_data:
  gc_news:
  gc_avatars:
  gc_certs:
  gc_acme:
