<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html

    DirectoryIndex index.html index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Секреты и служебные каталоги наружу не отдаём
    <DirectoryMatch "^/var/www/html/(data|docker|db|\.git)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^(config\.php|\.env.*|.*\.key|Dockerfile|docker-compose\.ya?ml)$">
        Require all denied
    </FilesMatch>


    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
