<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html

    DirectoryIndex index.html index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Секреты и служебные каталоги наружу не отдаём
    <DirectoryMatch "^/var/www/html/(data|docker|db|includes|\.git)">
        Require all denied
    </DirectoryMatch>

    # Исходные данные CodeQuest вместе с правильными ответами. Игре они
    # не нужны (уровень без ответов отдаёт api/pixelgame-level.php),
    # сервер читает их с диска как запасной источник.
    <DirectoryMatch "^/var/www/html/games/pixelgame/data">
        Require all denied
    </DirectoryMatch>

    # Папки, куда пишут загрузки (новости, аватары): PHP здесь не
    # исполняется никогда, .htaccess не читается. Даже если кто-то
    # протащит файл с кодом под видом картинки — он не запустится.
    <DirectoryMatch "^/var/www/html/img/(news|avatars)">
        AllowOverride None
        php_admin_flag engine off
        <FilesMatch "\.(php\d?|phtml|phar|pht|phps)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    <FilesMatch "^(config\.php|\.env.*|.*\.key|Dockerfile|docker-compose\.ya?ml)$">
        Require all denied
    </FilesMatch>


    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
